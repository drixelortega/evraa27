<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123f26">
  <title>No connection | EVRAA 2027</title>
  <style>
    :root { color-scheme: light dark; font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif; }
    body { display: grid; min-height: 100vh; min-height: 100dvh; margin: 0; place-items: center; padding: 24px; background: #f5f6f0; color: #102219; text-align: center; }
    main { max-width: 360px; }
    img { width: 96px; height: 96px; border-radius: 24px; }
    h1 { margin: 18px 0 8px; color: #123f26; font-size: 24px; }
    p { margin: 0 0 20px; color: #5f6e65; line-height: 1.5; }
    button, a { display: inline-block; margin: 4px; padding: 12px 20px; border: 0; border-radius: 12px; background: #1d6b3a; color: #fff; cursor: pointer; font: inherit; font-weight: 800; text-decoration: none; }
    a { background: none; color: #1d6b3a; }
    @media (prefers-color-scheme: dark) { body { background: #0b130f; color: #e8efe9; } h1 { color: #e3f1e6; } p { color: #94a499; } a { color: #7dd89b; } }
  </style>
</head>
<body>
  <main>
    <img src="evraa/images/icons/icon-192.png" alt="">
    <h1>No connection</h1>
    <p>This page has not been opened on this device yet, so there is no saved copy. Pages you have already visited still work without a signal.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <a href="index.html">Go to Home</a>
  </main>
</body>
</html>
